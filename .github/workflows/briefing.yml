name: Daily Market Briefing

# 매일 아침(KST) 개장 전 브리핑 자동 생성 → JSON 커밋 → Vercel 자동배포
on:
  schedule:
    # 21:07 UTC = 익일 06:07 KST 발화. 일~목(UTC) = 월~금(KST) 아침.
    #
    # 정각(:00)을 피하는 이유: GitHub 스케줄은 best-effort라 부하가 몰리면 밀린다.
    # 전 세계 cron이 정각에 집중되므로 :00은 최악 구간 — 실제로 '0 21'(06:00 KST)로
    # 뒀을 때 발화가 06:56으로 56분 밀려 브리핑이 07:02에야 올라갔다(run 29371292760).
    # 잡 자체는 ~6분이면 끝나므로, 혼잡한 정각만 피하면 06:20 전후 완료를 기대할 수 있다.
    #
    # 06시대보다 더 당기지 못하는 이유: 브리핑은 미국 증시 '마감' 수치를 써야 하는데
    # 마감(16:00 ET)이 서머타임에 따라 이동한다.
    #   EDT(3~11월): 20:00 UTC = 05:00 KST / EST(11~3월): 21:00 UTC = 06:00 KST
    # 겨울 마감이 06:00 KST이므로 05시대로 당기면 겨울엔 마감 전에 실행돼 수치가 빈다.
    - cron: '7 21 * * 0-4'
  workflow_dispatch: {}  # 수동 실행(테스트)용

# 동시 실행 방지
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 브리핑 JSON 커밋/푸시
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase 재시도용 전체 히스토리

      - name: Compute KST date
        id: date
        run: echo "target=$(date -u -d '+9 hours' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 시총 상위 종목의 지지/저항은 백엔드의 scipy 피봇 알고리즘 결과다. 모델은 알 수 없으므로
      # 생성 '전에' 받아둔 뒤, 종목 목록을 모델에게 넘겨 코멘트만 쓰게 한다.
      # 실패해도 브리핑 본문은 나가야 하므로 continue-on-error — 이 섹션만 빠진다.
      - name: Fetch top market-cap stocks
        id: topcaps
        continue-on-error: true
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://calculatechart.onrender.com' }}
        run: |
          set -uo pipefail
          # Render 무료 플랜은 15분 무활동 시 슬립 → 첫 호출이 콜드스타트(30~60초).
          # keepwarm은 07:00~16:00만 도는데 이 잡은 06:07이라 항상 콜드다. 먼저 깨운다.
          curl -sS -m 120 "$BACKEND_URL/api/ping" || echo "ping 실패 — 그래도 계속 진행"

          fetch_market() {  # $1=market  $2=exclude(CSV)
            curl -sS -m 300 --retry 2 --retry-delay 15 \
              "$BACKEND_URL/api/briefing/top-caps?market=$1&limit=5&exclude=$2" \
              || echo '{}'
          }

          # 삼성전자(005930)·SK하이닉스(000660)는 '반도체 투톱' 섹션에서 이미 깊게 다루므로 제외.
          fetch_market KOSPI  "005930,000660" > /tmp/kospi.json
          fetch_market KOSDAQ ""              > /tmp/kosdaq.json

          jq -n \
            --slurpfile a /tmp/kospi.json \
            --slurpfile b /tmp/kosdaq.json \
            '{
               kospi:  ($a[0].items // []),
               kosdaq: ($b[0].items // []),
               as_of:  ($a[0].as_of // $b[0].as_of // null)
             }' > /tmp/top-caps.json || echo '{"kospi":[],"kosdaq":[],"as_of":null}' > /tmp/top-caps.json

          # 백엔드가 JSON이 아닌 응답(Render 오류 페이지 등)을 주면 jq가 실패한다 → 0으로 취급
          n_kospi=$(jq '.kospi  | length' /tmp/top-caps.json 2>/dev/null || echo 0)
          n_kosdaq=$(jq '.kosdaq | length' /tmp/top-caps.json 2>/dev/null || echo 0)
          echo "코스피 ${n_kospi}종목 / 코스닥 ${n_kosdaq}종목"
          jq -r '.kospi[], .kosdaq[] | "  \(.market) \(.ticker) \(.name)"' /tmp/top-caps.json || true

          if [ "$n_kospi" -eq 0 ] && [ "$n_kosdaq" -eq 0 ]; then
            echo "::warning::시총 상위 조회 실패 — top_caps 섹션 없이 진행"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            # 모델에게 넘길 입력 (티커/이름만 있으면 된다 — 숫자는 나중에 덮어쓴다)
            jq '{kospi: [.kospi[] | {ticker, name}], kosdaq: [.kosdaq[] | {ticker, name}]}' \
              /tmp/top-caps.json > /tmp/top-caps-input.json
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate briefing with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            `.github/briefing/prompt.md` 파일을 읽고 그 지침을 정확히 따라라.
            TARGET_DATE(KST 기준 브리핑 대상일) = ${{ steps.date.outputs.target }}
            TOP_CAPS_INPUT = ${{ steps.topcaps.outputs.ok == 'true' && '/tmp/top-caps-input.json' || '(없음 — top_caps 키를 생략하라)' }}
            결과 JSON을 frontend/public/briefings/${{ steps.date.outputs.target }}.json 과
            frontend/public/briefings/latest.json 두 파일로 저장하라. git 커밋은 하지 마라.
          claude_args: '--allowedTools "Read,Write,Edit,WebSearch,WebFetch,Bash(node:*)"'

      # 모델이 쓴 top_caps 숫자를 백엔드 계산값으로 덮어쓴다 (코멘트만 살린다).
      - name: Merge authoritative top-caps numbers
        if: steps.topcaps.outputs.ok == 'true'
        run: |
          node .github/briefing/merge-top-caps.mjs /tmp/top-caps.json \
            "frontend/public/briefings/${{ steps.date.outputs.target }}.json" \
            "frontend/public/briefings/latest.json"

      # 모델은 자기가 실행된 실제 시각을 알 수 없어 07:00 같은 그럴듯한 값을 지어낸다.
      # 워크플로우가 실제 시각(KST)으로 덮어써야 화면의 '생성 시각'이 사실과 맞는다.
      - name: Stamp real generated_at
        run: |
          NOW="$(date -u -d '+9 hours' +%Y-%m-%dT%H:%M:%S)+09:00"
          for f in "frontend/public/briefings/${{ steps.date.outputs.target }}.json" \
                   "frontend/public/briefings/latest.json"; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f 없음 — 스탬프 스킵"
              continue
            fi
            tmp=$(mktemp)
            jq --arg now "$NOW" '.generated_at = $now' "$f" > "$tmp" && mv "$tmp" "$f"
            echo "$f ← generated_at=$NOW"
          done

      - name: Commit & push briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/briefings/*.json
          if git diff --cached --quiet; then
            echo "브리핑 변경 없음 — 스킵"
            exit 0
          fi
          git commit -m "chore(briefing): ${{ steps.date.outputs.target }} 데일리 마켓 브리핑 자동 생성"
          # 생성에 수 분 걸리는 동안 다른 커밋이 main에 들어와 non-fast-forward가 날 수 있음.
          # 브리핑 JSON은 다른 파일과 겹치지 않으므로 rebase 후 재시도하면 항상 깔끔히 반영된다.
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "push 성공"; exit 0
            fi
            echo "push 거부 — origin/main 리베이스 후 재시도 ($i/5)"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "::error::브리핑 push 5회 재시도 실패"
          exit 1
