name: Keep Backend Warm

# Render 무료 플랜은 15분 무활동 시 슬립 → 첫 접속 30~60초 콜드스타트.
# 장 시간대(KST)에 10분마다 /api/ping 을 호출해 깨어있게 유지한다.
on:
  schedule:
    # UTC 기준. KST = UTC+9.
    # 21시부터 시작하는 이유: 브리핑이 06:07 KST에 발화하고 가족이 06:30쯤 읽는데,
    # 웜업이 07:00부터면 그 시각 '차트 분석'은 콜드스타트(30~60초)를 맞는다.
    - cron: '*/10 21-23 * * 0-4'  # 06:00~08:59 KST (월~금 아침, 브리핑·개장 전 웜업)
    - cron: '*/10 0-6 * * 1-5'    # 09:00~15:59 KST (월~금 장중)
  workflow_dispatch: {}          # 수동 웜업

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /api/ping
        run: |
          # 백엔드 URL: 레포 변수 BACKEND_URL 우선, 없으면 실제 서비스 URL 기본값
          URL="${{ vars.BACKEND_URL }}"
          if [ -n "$URL" ]; then
            echo "레포 변수 vars.BACKEND_URL 사용: $URL"
          else
            echo "레포 변수 비어있음 → 기본값 사용 (Variables 탭에 BACKEND_URL이 있는지 확인)"
          fi
          URL="${URL:-https://calculatechart.onrender.com}"
          URL="${URL%/}"
          echo "Warming: $URL/api/ping"
          for i in 1 2 3; do
            code=$(curl -sS -m 90 -o /dev/null -w '%{http_code}' "$URL/api/ping" || echo "000")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::warmup ping 실패 (백엔드가 콜드/다운 상태일 수 있음)"
          # 핑 실패로 알림 스팸이 나지 않도록 워크플로우 자체는 성공 처리
          exit 0
